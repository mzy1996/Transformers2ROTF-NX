# T2ROTF.toml —— T2ROTF（变形金刚2：卷土重来 / Xbox 360）Switch 移植的实验开关
#
# 放置位置：与 T2ROTF.nro 同一个目录（exe_dir），文件名必须是 T2ROTF.toml
#           Switch 上就是 sdmc:/switch/Transformers2ROTF/T2ROTF.toml（与 NRO 同目录）
#           文件名必须与 NRO 内注册的应用名同名：T2ROTF
# 读取时机：应用初始化早期（rex_app 的 Setup 里 rex::cvar::LoadConfig），
#           本文件里的开关都是 kInitOnly，必须在启动时给定，改了要重启游戏。
# 键名规则：cvar 名就是键名（全小写、下划线分隔），布尔值写 true / false。
# 等价的环境变量写法（PC/调试端可用）：REX_SA2_RENUT_DISPLAY_GUARD=1
#
# 构建版本：T73 / v9.0-VIVO（NRO sha256 4a691426…，59,970,290 字节，2026-11-02 构建。
#           上一份 ceb43ebf…（v8.9-PRODUCE）已被本份取代，请以 4a691426… 为准）
#           版本判据只认日志里 [video] T2ROTF BUILD 那一行（现在是 v9.0-VIVO）；应用自身
#           banner 仍是旧的 v6.27-MAPFIX，不可用作版本判据；日志里还会看到 v7.6-RECON /
#           v7.7-ALIGN / v8.2…v8.9 字样 —— 那是 cvar 帮助文本与历史判读行，不是版本混装。
#           字节数不是判据，一律以哈希为准。
