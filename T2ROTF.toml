#       改完 guest 自己的 ++*(A+248)（arm 计数）与挂队列 A+8 就正好落在门的
#       *(*(0x82E55E20+16)+272+4*slot) 与交付的 ctx+slot*80+8 上。
# 为什么需要它：每帧 tick 用 sub_828823F8() 解析「当前呈现设备」并投递到**那个设备**的通道，
#       而消费者链（排空/泵/门/交付）恒定用显示对象 0x82E55E20 的通道 ⇒ arm 计数与队列
#       全落到别人通道上，门读到的计数恒 0、泵 0 次成功、排空永久自旋（0 fps 黑屏）。
