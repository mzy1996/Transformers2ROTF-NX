#                 垂直同步线程从此**绝不进入 guest 代码**，只负责派发中断与打报告。
#                 这样即使驱动卡在 guest 提交内部，中断派发照常进行，guest 的完成侧才有机会
#                 被释放（这正是 v8.3 自锁的解药）。
#              b) 让位语义原样保留（dev+16568 / base+284 一变，让位 3 次刷新不叠加提交）；
#                 G12（after_ms）、G13（div）对驱动线程同样生效。
