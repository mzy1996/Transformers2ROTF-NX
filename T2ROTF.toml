#       c288=… b256=…（限频：前 16 次 + 每 512 次）、
#       T2DIAG ALIGN-SELF n=… c16=… c24=…（限频：前 8 次）。
# 回退对照：false = 完全按 guest 原样投递（会退回「门永不就绪 + 排空自旋」的 0 fps 黑屏）。
