sa2_renut_gpu_signal_diag = true

# ---------------------------------------------------------------------------
# 开关 G5（T44/v8.0 新增，默认**关**）：把写指针直接回写进读指针回写槽
# ---------------------------------------------------------------------------
# 语义：guest 用 VdEnableRingBufferRPtrWriteBack 指定的槽位里，由宿主立刻写入 WPTR
#       （等于告诉 guest「GPU 已消费完命令环」）。
# 为什么默认关：Renut 自己的 D3D 替换（renut_native_sub_822D13F0 = D3D_CBlocker_Check）
#       已经用它的 fence 回答了 guest 的环空间等待；**伪造读指针正是早期构建里
#       「假装 guest 有进展」那类有害做法**（曾把显示会计刷穿回绕）。
#       只在排查「环空间停等」时才临时打开取证。
sa2_renut_gpu_rptr_sync = false

# ---------------------------------------------------------------------------
# 开关 G6（T47/v8.1 新增，默认**开**）：宿主代客派发 guest 自己的图形中断回调
# ---------------------------------------------------------------------------
# 语义：guest 的注册点（sub_822E1690 → VdSetGraphicsInterruptCallback(0x822D47A0, dev)）被
#       Renut 的原生设备创建路径旁路时，宿主改用同一个 guest 回调地址、同一个 guest 设备、
#       同一组参数 {source=0, dev} 派发 —— 与 SDK graphics_system.cpp 的
#       MarkVblank → DispatchInterruptCallback({0, user_data}, 2) 完全同构。
# 为什么默认开：v8.0 实机证明「等 guest 注册」这条路根本不会发生（cb=0、irq=0、r1951=0），
#       不代客派发则整条显示中断链永远是空的（dev+16548 冻结、sub_822D9570 永不执行、
#       显示侧等待方死等、0 fps 黑屏）。若 guest 将来真的注册了，以它的回调为准，本键不生效。
# false = 退回 v8.0 行为（只派发 guest 自己注册的回调，实机等于完全不派发），仅供 A/B。
sa2_renut_gpu_signal_hostcb = true

# ---------------------------------------------------------------------------
# 开关 G7（T47/v8.1 新增，默认 0）：代客派发时传给回调的设备地址
# ---------------------------------------------------------------------------
# 0 = 自动解析：读槽 0x820011AC（本运行时 KeGetCurrentProcessType() 为 USER=1，guest 自己读的就是
#     这一个）→ 取它指向的 cell → 取 cell 里的 device（失败再试 0x820011B0）。
#     [v8.2-SHADOW] 这两步读**一律经 chunk 的 shadow 别名**（RexGmShadowFor），不再直读窗口地址；
#     该 chunk 未提交（取不到 shadow）时这一步直接跳过并计入 sinSombra，随后交给 G10 的钩子兜底。
# >0 = 强制这个地址（排查用）。解析成功会缓存，并打一行
#     「设备解析 来源=槽/钩子 slot=… cell=… dev=… hookDev=… sinSombra=…/…」。
sa2_renut_gpu_signal_cb_data = 0

# ---------------------------------------------------------------------------
# 开关 G8（T47/v8.1 新增，默认**开**）：派发前的指针守卫
# ---------------------------------------------------------------------------
# 语义：显示 ISR 尾部会间接调用 *(dev+16544)（实机 = 0x82880A48，vblank 统计回调），
#       source=1 分支还会调 *( *(dev+10900) +16 )。这些字段若被写坏成非 guest 代码地址
#       （不在 0x82000000-0x82FFFFFF），派发期间先清零、调用完还原 —— 避免 ISR 尾部
#       变成跳进裸数据的控制流。
# false = 完全按 ISR 原样调（含崩溃风险），仅供 A/B。
sa2_renut_gpu_signal_cb_guard = true

# ---------------------------------------------------------------------------
# 开关 G9（T47/v8.1 新增 → v8.5-COMPLETE 改为默认**开**）：代发 source=1（提交完成）中断
# ---------------------------------------------------------------------------
# 语义：给同一个 guest 回调再发 {source=1, dev}，即 guest ISR 里「提交完成」那一支
#       （它读 *(dev+10900) 暂存块、再调 *(blk+16)，并清自己那一位在飞掩码）。
# 为什么现在默认开：v8.4-SPLIT 实机日志（T58 判读）已坐实这一支**一次都没派发过**：
#       GPSIG 的 s1 恒为 0、skipS1 严格等于 vblanks（120/240/…/2880）、dev+16568 冻在 5。
#       而它正是 guest 自己的 ISR 里唯一能把「在飞显示项」完成掉的通路 —— 不派发，
#       *(0x82E55CE0+288) 就永远回不到 0，排空 sub_82882200 的 while(284+288!=0) 永远
#       转不出去（驱动线程 dentro=1 冻结、管线停在第 6 帧），呈现线程则在事件
#       *(0x82DBB5E0)=0xF8000068 上等到 2.14e7 次。这不是「假装 guest 有进展」：这只是把
#       guest 本来就该收到的那一个中断补上，完成仍由 guest 自己的 ISR 判定与记账。
# 补齐的第二个缺陷：旧判据拿「guest 对象区间 0x40000000-0x90000000」校验暂存块地址，
#       实机 *(dev+10900)=0xBDF80080（D3D 驱动自己的 fence/暂存块）必然被判无效而一条不发；
#       现在只要求非零、4 字节对齐、在可寻址 32 位范围内。*(dev+10900)==0 时仍然不发。
# 用法：默认跑；日志里 s1 应随 vblanks 同步增长，若仍无画面，看 GPSIG2 行新增的
#       ptr272/c16/A0..C2/dv10904/blk0/blk4 —— 它们就是门 sub_82881B88 的全部就绪输入。
# false = v8.4 行为（提交完成永不报告），仅供 A/B。
sa2_renut_gpu_signal_hostcb_s1 = true

# ---------------------------------------------------------------------------
# 开关 G9b（T59/v8.5-COMPLETE 新增，默认 2）：提交完成中断的派发时机
# ---------------------------------------------------------------------------
# 语义：0 = 一条也不发；1 = 仅有在飞显示项时发（*(0x82E55CE0+284)/+288 非零）；
#       2 = 每次刷新都发 —— 与硬件「一帧一次提交完成中断」同节奏（默认）。
# 为什么默认 2：真实 GPU 的完成中断不依赖 guest 是否已把在飞计数写出来；用 1 会让
#       「第一个在飞项卡住」变成「一个完成中断也不发」的死锁，2 才能打破互锁。
# 用法：想把噪声降到最低时改 1 做 A/B（日志 s1pend 会记录因此跳过的次数）。
sa2_renut_gpu_signal_hostcb_s1_mode = 2

# ---------------------------------------------------------------------------
# 开关 G10（T50/v8.2 新增，默认**开**）：把 D3D 钩子观测到的设备当作兜底来源
# ---------------------------------------------------------------------------
# 语义：guest 线程在 sub_822D4488（环提交外层）与 sub_822D9570（真显示 ISR）的入口把 r3
#       （= D3D 设备，实机 v8.0 的 PERRO 行实证 0x40070600）上报给显示信号模块。当 G7 的
#       自动解析（VdGlobalDevice 双槽，现在走 shadow 安全读）取不到可用设备时，就用这个
#       观测值，让代客派发（G6）仍能进行。
# 为什么默认开：v8.1 实机在「读槽」这一步就崩了（正是本版要修的那一处）。修好之后槽有可能
#       仍然解析不出（该 chunk 未提交），此时若没有兜底来源，代客派发就会一直跳过、
#       整条显示中断链依旧是空的。**槽优先、钩子兜底**：两个来源都拿到时以槽为准，不一致
#       会在「设备解析 来源=…」那行里明确标注（hookDev 与 dev 并列打印，便于判读）。
# 注意：G10 只影响「解析不出时的兜底」，不会覆盖 guest 自己注册的回调（G6 的优先级不变）。
sa2_renut_gpu_signal_dev_hook = true

# ---------------------------------------------------------------------------
# 开关 G11（T53/v8.3 新增，默认**开**）：宿主按真实刷新节奏驱动 guest 自己的每帧显示提交
# ---------------------------------------------------------------------------
# 语义：在每个真实刷新里，经 FunctionDispatcher 调用 guest 自己的每帧显示提交入口
#       sub_82880978（无参，纯 guest 全局状态驱动）。这是「每帧把工作交给显示管理器」的那次
#       调用；v8.2 实机证明显示中断链已经通了（irq/mmio_r/r1951/hostcb 全增长），但这次调用
#       从未发生 ⇒ 每帧提交侧不产出（mmio_w=0、SWAP n=1、16568 冻在 5）⇒ 0 fps 黑屏。
#       **v8.4-SPLIT 起，这次调用由独立驱动线程执行（见 G15），不再由垂直同步线程执行**。
# 边界：不写任何显示会计字段、不碰门/泵热路、不改影子安全访存；presenter()/provider() 仍为 null
#       （画面仍由 Renut/deko3d 出）。
#       **v8.8-LIVENESS 修正让位判据**：v8.4/v8.6 时代的判据是「dev+16568 变化 或 base+284 变化
#       就让位」，但 v8.6-FLIP 的代客呈现记账每刷新都会自增 dev+16568，于是驱动线程每一轮都让位
#       （v8.7 实机日志 DRIVE drive=0 ok=0 produce=0 vivo=571）⇒ guest 侧从不产出帧 ⇒ 有声无画。
#       现在只认 guest 自己自增的 base+284：284 == 0（没有待交付帧）才驱动；284 != 0（已有帧
#       在等 guest 自己的消费者）让位；base+284 连续 45 次刷新不动时仍驱动一次，避免消费者
#       没在跑时把整条链饿死。宿主绝不写 284/288。
#       **v8.8b**：补产的入参不再用 0 —— 先调 guest 自己的解析器 sub_828823F8 取「当前呈现记录」，
#       取到且合理才把它作 r3 调 sub_82882730（否则跳过并计 prodSinDev=）；当前显示对象
#       *(0x82DBB608) 只作诊断、不再当闸门（v8.7 实机该字段恒 0，当闸门会把驱动永久拦下）。
#       **v8.9-PRODUCE**：驱动线程上「每一次进 guest」的顺序改为「先投递（G14）、再（可选）提交
#       （G17，默认关）、最后（可选）有界非阻塞交接（G18，默认 0）」。原因是 v8.8 实机证明提交
#       入口一进去就永不返回，而那时补产排在它后面、一次都没跑到；G17/G18 默认关正是为了把这条
#       链交回 guest 自己的线程。另加 G19 看门狗：卡死超过 500 ms 即打 DRIVE-WEDGE 快照并停驱动。
# 诊断行：[video] T2DIAG DRIVE drive=… ok=… ini=… dentro=… noObj=… fallos=… vivo=… produce=… prodSinDev=… estanc=… commit=… pump=… bombeos=… muerto=… wedge_ms=… fase=… t_guest=… 16548=… 16568=… 284=… 288=… obj=… ev=… mmio_w=…
#         （每 2 s 一行）；[video] T2DIAG DRIVE n=… obj=… 284 a→b 288=… 16568=… 16548=… saltos_vivo=… estancados=…
#         （首次驱动后头 4 次 + 每 60 次各一行）。
# false = 完全退回 v8.2 行为（中断通、每帧提交侧不产出），仅供 A/B 对照。
sa2_renut_display_drive = true

# ---------------------------------------------------------------------------
# 开关 G12（T53/v8.3 新增，默认 2500）：开始驱动前的等待毫秒数
# ---------------------------------------------------------------------------
# 语义：自垂直同步线程启动起满这么多毫秒后才开始驱动，让 boot/init 阶段保持原样（不被宿主插一脚）。
# 0 = 从第一次刷新就驱动。
sa2_renut_display_drive_after_ms = 2500

# ---------------------------------------------------------------------------
# 开关 G13（T53/v8.3 新增，默认 1）：每 N 个刷新驱动一次（A/B 二分用）
# ---------------------------------------------------------------------------
# 1 = 每个刷新都驱动（60 Hz）；2 = 30 Hz；…大于 1 时只在 n % div == 0 的刷新上驱动。
sa2_renut_display_drive_div = 1

# ---------------------------------------------------------------------------
# 开关 G14（T53/v8.3 新增，v8.8 起默认**开**）：提交无产出时补调一次 guest 原生生产者
# ---------------------------------------------------------------------------
# 语义：驱动过每帧提交入口 sub_82880978 之后，如果 base+284 仍然是 0（这一轮提交没有产出任何
#       帧），就再调一次 guest 原生生产者包装 sub_82882730：它在 guest 侧完成「入队 + 自增
#       base+284 + 置位帧事件 *(0x82DBB5E0)=F8000068」，正是呈现线程 sub_82881848 死等的那
#       个信号。284 已有值（已有帧在等消费者）时**绝不**补调，所以不会重复投递。
# 为什么 v8.8 改成默认开：v8.6/v8.7 的「提交入口内部已做 hand-off」只在 guest 提交链真的跑
#       起来时才成立；实机上提交链本身就没产出（mmio_w=0、284 恒 0），必须由生产者侧补一次。
# 边界：只调 guest 自己的函数，宿主仍然不写 284/288/16548/16564/16568 任何一个字段。
# **v8.9-PRODUCE**：本项已**前移到每帧提交入口（G17）之前**独立执行 —— v8.8 实机证明提交入口
#       一进去就永不返回，补产排在它之后等于一次都跑不到（produce=0 prodSinDev=0）。现在宿主
#       每次驱动都先投递一帧（284 == 0 时），再视开关决定是否走提交/交接。
# 诊断行：[video] T2DIAG PRODUCE n=… rec=… cuenta=… array=… 284=… 288=…（头 4 次 + 每 60 次），
#       解析不到合法记录时另打一行 `rec=… 无合法记录，跳过`（头 3 次）。
# false = 不投递，只（可选）驱动提交入口（A/B 对照用）。
sa2_renut_display_drive_produce = true

# ---------------------------------------------------------------------------
# 开关 G15（T56/v8.4 新增，默认**开**）：把每帧提交驱动搬到独立线程
# ---------------------------------------------------------------------------
# 语义：true = 驱动（G11）只在新增的独立宿主线程 "T2ROTF Dirigir" 上执行；垂直同步派发线程
#       从此**绝不进入 guest 代码**，只派发中断与打诊断报告。false = 退回 v8.3 行为（驱动与
#       中断派发共用垂直同步线程），仅供 A/B 复现自锁。
# 为什么默认开（v8.3 实机实证）：guest 的每帧提交链会走到排空 sub_82882200 的判据
#       while (*(base+284) + *(base+288) != 0) 上等一个显示完成；本移植里这个完成的唯一来源
#       就是垂直同步线程自己派发的显示 ISR。把提交调用放在同一条线程上 = 自锁：实机在该线程
#       最后一条日志 DRAIN-IN n=13 之后，vblanks 停在 120、irq/mmio_r/hostcb 全部冻结，
#       整链在 6 帧后死住（用户观感：依旧黑屏）。搬到独立线程后，中断派发不再可能被 guest
#       代码拖住。
# 诊断行：[video] T2DIAG DRIVE drive=… ok=… ini=… dentro=… noObj=… fallos=… vivo=… produce=…
#         （ini 与 ok+fallos 的差额 = 卡在 guest 提交内的驱动次数；dentro=1 表示此刻正卡着）、
#       [video] T2ROTF GPSIG: 每帧提交驱动线程已启动/已停止 …
sa2_renut_display_drive_thread = true

# ---------------------------------------------------------------------------
# 开关 1（T25 遗留，已证伪，默认关）：宿主代客跑一趟 guest 显示排空
# ---------------------------------------------------------------------------
# 曾经的思路：宿主每帧代客执行 sub_82881E00(ctx=container, arg=0xFFFFFFFF, flag=1)。
# 为什么无效：该候选把 container 记成了 0x82E55EE0，而真正的 container 是
#             0x82E55E20（取证自 sub_82882200 的 addi r28,r11,24096 = 0x82E55E20）。
#             地址差 0xC0 ⇒ 门读到的是垃圾，函数立刻返回 0，等于什么都没做。
# 现状：T28 已修正 kDisplayCtx，本开关保留作为对照手段；修复不依赖它。
sa2_renut_display_tick = false

# ---------------------------------------------------------------------------
# 开关 2（T25 遗留，已证伪，默认关）：把 guest 自己的交换体放跑
# ---------------------------------------------------------------------------
# 曾经的思路：Swap 钩子里再调 guest 的 D3DDevice_Swap 本体 sub_822D9D70。
# 为什么无效：空转不在 Swap 路径上，而在游戏自己的每帧 tick
#             sub_82ABB7D0 -> sub_82882200 里；挂 Swap 钩子不可能驱动它。
# 现状：保留作为对照手段，修复不依赖它。
sa2_renut_swap_callthrough = false

# ---------------------------------------------------------------------------
# 开关 G16（T61/v8.6 新增，默认**开**）：把「一次真实呈现完成」交回 guest 自己记账
# ---------------------------------------------------------------------------
# 语义：true = 每个刷新周期（垂直同步线程派发完显示中断之后）由宿主**代客调用** guest 自己的
#       呈现记账函数 sub_822D9688(r3=0，即「本次呈现已完成、没有新画面要换」），由 guest 代码
#       在它自己的自旋锁 dev+16712 内完成：*(dev+16564)++、*(dev+16568)++、
#       把 *(*(dev+10900)+4)（GPU 标识字）清 0。宿主自己不写任何 guest 字段。
#       false = 不调用（退回 v8.5 行为）。
# 为什么默认开（T61 离线精读定论）：
#   ① guest 的图形中断回调 sub_822D47A0 的 r3==1（提交完成）分支只做「*(blk+16) 非 0 才
#      间接调用 + 清 *(blk+0) 的当前 CPU 位」，而 *(blk+16) 在本移植里从未被写非 0
#      ⇒ v8.5 派发 source=1 实际是空操作，一条在飞显示项都 retire 不掉。
#   ② 真正的显示/vblank 入口是同一回调的 r3==0 分支（被 MMIO 位 0x7FC86544 & 1 门控）
#      → sub_822D9570(dev)。它已经在跑（实机 *(dev+16548) 涨到 2738），但它只排空换页环
#      (dev+16700/16704)，环恒空 ⇒ 16568 不涨、*(*(dev+10900)+4) 永不清零。
#   ③ 换页环与 16564/16568 的唯一生产者 sub_822D9688 在本构建里**零静态调用者**——它的调用者
#      是 guest 自己的 D3D 换页路径，而那一路已被宿主 Swap 钩子整体替换。
#      ⇒ 黑屏缺环 = 「呈现侧记账者无人调用」：16568 冻在 5、GPU 标识字永不清零、
#        base+288/base+284 恒 1、sub_82881848 永等 F8000068。
# 诊断行：[video] T2DIAG PRESENT n=… dev=… 16564=… 16568=… 16548=… ringW16704=… blk10900=… blk4=… saltados=…；
#       调用前若「两跳设备槽 0x820011AC → 设备」与宿主已解析设备对不上，则本次跳过并只报一行
#       `[video] T2ROTF GPSIG: v8.6 代客呈现记账暂不调用：dev=… slot(4524)=… *(slot)=…`。
sa2_renut_display_present_guest = true

# ---------------------------------------------------------------------------
# 开关 G17（T69/v8.9 新增，默认**关**）：每帧提交入口 sub_82880978 是否仍由宿主驱动
# ---------------------------------------------------------------------------
# 语义：true = 保留 v8.3～v8.8 的「宿主在每个刷新驱动 guest 自己的每帧显示提交入口
#       sub_82880978（无参、纯 guest 全局状态驱动）」；false = 不驱动（默认）。
# 为什么默认关（v8.8 实机证据）：宿主有史以来第一次调到它（19:09:18.102）就把 base+284 由 0
#       变 1（真的投出了一帧），但**同一个线程随即走进 guest 的排空链、再也没有回来** ——
#       该线程的最后一条输出是 `[T2DIAG DRAIN-IN n=13 idx=0 c24=1 c28=0 e24=1 e28=0`，
#       此后 DRIVE 全程 innerhalb（dentro=1）、drive=2 ok=1，整条显示链从此停摆。
#       而 v8.8 的补产分支排在它**后面**，于是 produce=0 prodSinDev=0 —— 一次都没跑到。
# 处置：本版把它默认关掉、并**把 G14 补产前移到它之前**（先投递、再提交），宿主只负责把
#       guest 自己的帧投进 guest 自己的显示管家，「渲染 + 呈现」交回 guest 自己的线程。
#       保留本开关只为 A/B 复现 v8.8 的那个卡死点。
# false = 只投递、不调提交入口（默认）。
sa2_renut_display_drive_commit = false

# ---------------------------------------------------------------------------
# 开关 G18（T69/v8.9 新增，默认 **0** = 关）：已投递帧的「有界非阻塞」交接次数上限
# ---------------------------------------------------------------------------
# 语义：>0 时，在「已有帧在飞」（`*(base+284) | *(base+288) != 0`）的情况下，最多调用
#       N 次 guest 自己的泵 sub_82881E00，入参 r3 = 0x82E55E20（显示容器）、r4 = -1
#       （全局在飞项）、r5 = 1（**非阻塞**：门不就绪即刻返回，绝不进入阻塞等待）。
# 为什么默认 0：guest 自己的呈现线程本来就是自然的交付者（它活着、正在 sub_82881848 里
#       轮询 base+284），把交接交回它是正确分工；宿主替它把显示回调叫起来正是 v8.8
#       卡死的教训（那个回调要等宿主/guest 自己的呈现节奏，宿主叫它就会把驱动线程留住）。
# 何时才需要设 1～4：实机日志若显示 base+284 已投出却**长期无人消费**（消费者线程不在跑），
#       再用它做有界消化的 A/B。
# 上限由 pump_max 严格限制（最多 N 次/刷新），且只在有帧在飞时才调 —— 不会空转、不会重复投递。
sa2_renut_display_drive_pump_max = 0

# ---------------------------------------------------------------------------
# 开关 G19（T69/v8.9 新增，默认 500）：驱动线程「卡在 guest 里」的看门狗阈值（毫秒）
# ---------------------------------------------------------------------------
# 语义：驱动线程每次进入 guest 代码前记起始时刻、返回后清标志；诊断线程（每 2 s）若发现
#       驱动线程仍停在 guest 代码里且已超过本阈值，就打印**一次**全量快照
#       `[T2DIAG DRIVE-WEDGE fase=… (相位名) transcurrido=…ms …]`（含 drive/ok/ini、284/288、
#       16548/16552/16564/16568、换页环 16700/16704、暂存块 blk0/blk4、帧事件 ev、显示对象 obj、
#       设备 dev），随后把驱动**永久停用**，不再叠加进入。
# 为什么需要它：v8.8 的「卡死」是静默的 —— DRIVE 只给一个 dentro=1，没人知道卡在解析器、
#       生产者、提交入口还是泵里的哪一段；相位名 + 设备快照一次落盘，下一轮判读不必再猜。
# 0 = 关闭看门狗（不判死、不打印快照）。
sa2_renut_display_drive_watchdog_ms = 500

# ---------------------------------------------------------------------------
# 开关 G20（T72/T73/v9.0 新增，默认 **true**）：投递通道钉到「活体显示设备」
# ---------------------------------------------------------------------------
# 语义：在生产者 sub_822B5608 的钩子里，把投递通道基址从**静态容器** 0x82E55E20+24
#       （= 0x82E55E38）改写为**运行期实际在用的活体显示设备自己的通道** dev+24
#       （实机 dev = 0x41770018 ⇒ 0x41770030）；同时若该设备的 *(dev+16) 不是自指，
#       就经 shadow 别名把它修成 dev（init 语义里它就该自指）。
# 为什么需要它（T72 逐指令定论）：排空/泵路径实际传给门的通道是那个堆对象 0x41770018，
#       而它的 *(0x41770018+16) == 0（PUERTA 探针 s16=00000000）⇒ 门实例 A 的就绪读
#       *(*(channel+16)+272+4s) 退化成 *(0x272+4s) 恒 0 ⇒ 三槽永不就绪 ⇒ 门恒返回 0，
#       排空链停在 lr=0x82881DE8 自旋（实机 100%）。把生产者钉到同一设备、并把设备自指修好，
#       门标记读址（dev+272）、生产者 arm 址（dev+272）、门交付弹址（dev+32）与生产者
#       push 址（dev+32）在**任何取址写法下**都重合，两侧句柄同一。
# 诊断行：[video] T2DIAG VIVO-LINK n=… dev=… c0=… c16_antes=…（捕获到活体设备并修复自指时限频）。
# false = 退回 v7.7-ALIGN 的静态通道写法（会退回「门恒不就绪 + 排空自旋」）。
sa2_renut_display_vivo = true

# ---------------------------------------------------------------------------
# 开关 G21（T72/T73/v9.0 新增，默认 **true**）：楔死态复位交给 guest 自己（sub_82882628）
# ---------------------------------------------------------------------------
# 语义：排空入口（sub_82882200 进入前）观测到楔死态 —— base+284 == 0 且 base+288 > 0，
#       并且两侧六槽 arm 标记全 0（0x82E55CE0+256/+260/+264、0x82E55E38+248/+252/+256、
#       dev+272/+276/+280）—— 连续 kReinicioTics = 120 次「泵进入」时，打印一条
#       [T2DIAG REINICIO n=… c284=… c288=… cont=… dev=… hechos=…] 并调用 guest 自己的
#       显示管线复位 sub_82882628()（无参数、硬编码 r31 = 0x82E55CE0）做**一次**整体复位：
#       它会清全局、清三组对象、并把 284 / 288 都置 0 —— 也就是把「一帧在飞永不被 retire」
#       的孤儿态交回 guest 自己的语义处置，宿主一个字都不写会计字段。
# 调用方式：用 PPCContext 副本调用，避免污染待转发的 ctx；总次数封顶 8 次，超出后打印
#       [T2DIAG REINICIO topado] 并停止（不再叠加复位）。
# 为什么需要它：v8.9 实机证明「帧已投出（284=1）→ 同线程走进排空链再也不回来」的残局无法靠
#       宿主单点配平收敛；guest 自己的复位例程是唯一知道该把哪些槽清干净的人。
# false = 只看观测行、不做复位。
sa2_renut_display_reinicio = true

