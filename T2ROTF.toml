# ---------------------------------------------------------------------------
# 语义：派发前 SetActiveCpu(cpu)，与 SDK 自己的 DispatchInterruptCallback 的猜测值（2）一致。
#       guest 从 PCR 读自己的逻辑 CPU 号，所以它只影响中断里 guest 看到的身份。
sa2_renut_gpu_signal_cpu = 2

# ---------------------------------------------------------------------------
# 开关 G4（T44/v8.0 新增，默认开）：GPSIG 诊断行
