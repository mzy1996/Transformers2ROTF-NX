# ---------------------------------------------------------------------------
# 开关 G1（T44/v8.0 新增，默认开）：显示完成信号源补齐 —— 本版就是靠它补的
# ---------------------------------------------------------------------------
# 语义：宿主侧安装一个**最小图形系统**（t2rotf::gpu_signal::GpuSignalSystem），它只做两件事：
#         a) 注册 0x7FC80000 的 64 KB MMIO 窗口（读值与 SDK graphics_system.cpp:232-262 逐条一致：
#            0x0F00→0x08100748、0x0F01→0x0000200E、0x194C→显示高度、**0x1951→1（vblank 门）**、
#            0x1961→视口尺寸；写 0x01C5 记录 CP_RB_WPTR、写 0x1844 吞掉）；
#         b) 起一条宿主线程，按显示刷新率把 guest 注册的图形中断回调派发进 guest：
#            ExecuteInterrupt(thread_state(), callback, {source=0, user_data}, 2) —— 与 SDK 的
#            MarkVblank → DispatchInterruptCallback(0, 2) 同语义。
#       **presenter()/provider() 保持 null，画面仍由 Renut/deko3d 出**；不写任何会计、
#       不碰 dev+16548 族字段（那是 guest ISR 自己的活）、不从 guest 热路调用。
# 为什么需要它：Renut 接管 D3D 时清空 config.graphics（app_integration.cpp:87），把上面两样
#       一起移走了 ⇒ guest 显示链永久停摆（dev+16548 冻在 5、sub_822D9570 一次未进、
#       irq47=0/irq95=0、影片等待方 n=34,520,000 死等、0 fps 黑屏）。
# 诊断行（[video] 前缀）：T2ROTF BUILD v8.0-GPUIRQ（每进程一次，版本判据）、
#       T2ROTF GPSIG: …（安装期一次性：接管、MMIO 窗口、回调注册、ring 初始化、读指针槽、线程启动）、
#       T2DIAG GPSIG vblanks=… irq=… cb=… ud=… r1951=… mmio_r=… mmio_w=… wptr=…(…) rptr_pub=… sup1844=… hz=…
#       （每 2 s 一行；cb 是 guest 回调地址，irq 是真正派发进 guest 的次数，
#        r1951 是 guest 读「垂直同步状态字」的次数 —— 这三项是判读钥匙）。
# false = 完全不安装（退回 v7.7：门永不就绪、影片等待方死等、0 fps 黑屏，仅供 A/B 对照）。
sa2_renut_gpu_signal = true

