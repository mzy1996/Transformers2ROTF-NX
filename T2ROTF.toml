#           2) 根因（T55 定论）：v8.3 把「替 guest 走每帧提交」这件事放在了**垂直同步派发线程**
#              上。guest 的每帧提交链（sub_82880978 → … → 排空 sub_82882200）在排空判据
#              while (*(base+284) + *(base+288) != 0) 上会**等一个显示完成**，而这个完成在本
#              移植里唯一的来源正是同一条垂直同步线程的 ISR 派发 ⇒ **在同一个线程里自锁**。
#              证据链闭合：线程最后一条日志落在 DRAIN-IN（就在 guest 排空入口），此后
