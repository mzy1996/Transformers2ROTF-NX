#              但同一日志里，宿主**垂直同步派发线程** t1969709635156801032 的最后一条输出是
#              00:12:48.048 的 [T2DIAG DRAIN-IN n=13 idx=0 c24=1 c28=0 e24=1 e28=0]，此后 60 s
#              再无一字：T2DIAG GPSIG 报告只到 00:12:47.431 的 vblanks=120，下一行 2 s 报告
