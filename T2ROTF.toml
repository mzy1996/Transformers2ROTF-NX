# 开关 H（T41/v7.7 新增，默认开）：显示投递通道对齐
# ---------------------------------------------------------------------------
# 语义：在生产者 sub_822B5608 的钩子里（**每次投递 1 次，不在门/泵热路**），把投递的通道
#       基址 A 改写成消费者侧真正读/弹的那条通道 0x82E55E20+24；同时若管理器自身的
